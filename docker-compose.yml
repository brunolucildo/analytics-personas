name: rondo

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rondo
      POSTGRES_USER: rondo_migrator
      POSTGRES_PASSWORD: rondo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rondo_migrator -d rondo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  loki:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: grafana/loki:latest
    image: rondo/loki-toolbox:local
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tempo:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: grafana/tempo:latest
    image: rondo/tempo-toolbox:local
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mimir:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: grafana/mimir:latest
    image: rondo/mimir-toolbox:local
    command:
      - -config.file=/etc/mimir/mimir.yaml
      - -target=all
    ports:
      - "9009:9009"
    volumes:
      - ./infra/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:9009/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:latest
    image: rondo/otel-collector-toolbox:local
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      POSTGRES_ENDPOINT: ${POSTGRES_ENDPOINT:-postgres:5432}
      POSTGRES_USER: ${POSTGRES_USER:-rondo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rondo}
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
      - mimir
      - postgres
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
