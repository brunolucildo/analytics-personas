extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Postgres server metrics (connections, transactions, locks, cache, size). The Compose file
  # passes POSTGRES_ENDPOINT, POSTGRES_USER and POSTGRES_PASSWORD, which `bun run infra:up` derives
  # from DATABASE_URL (a local host becomes the `postgres` service). The user is `rondo_app`, which
  # holds `pg_monitor` (statistics views only, no table data); never point this at a superuser.
  postgresql:
    endpoint: ${env:POSTGRES_ENDPOINT}
    transport: tcp
    username: ${env:POSTGRES_USER}
    password: ${env:POSTGRES_PASSWORD}
    databases:
      - rondo
    collection_interval: 15s
    tls:
      insecure: true
    metrics:
      postgresql.deadlocks:
        enabled: true
      postgresql.database.locks:
        enabled: true
      postgresql.temp_files:
        enabled: true
      postgresql.sequential_scans:
        enabled: true

processors:
  batch: {}
  # The receiver reports no service name; without one the Mimir series would have no `job`.
  resource/postgres:
    attributes:
      - key: service.name
        value: rondo-postgres
        action: upsert
  # Resource attributes do not become Prometheus labels on this exporter; copy the ones we group by.
  transform/postgres:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["database"], resource.attributes["postgresql.database.name"]) where resource.attributes["postgresql.database.name"] != nil
          - set(datapoint.attributes["schema"], resource.attributes["postgresql.schema.name"]) where resource.attributes["postgresql.schema.name"] != nil
          - set(datapoint.attributes["table"], resource.attributes["postgresql.table.name"]) where resource.attributes["postgresql.table.name"] != nil
          - set(datapoint.attributes["index"], resource.attributes["postgresql.index.name"]) where resource.attributes["postgresql.index.name"] != nil

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]
    metrics/postgres:
      receivers: [postgresql]
      processors: [resource/postgres, transform/postgres, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
